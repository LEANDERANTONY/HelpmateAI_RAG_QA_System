name: Build & Deploy

on:
  push:
    branches: [main]
    # This pipeline builds + ships the BACKEND /api image to the VPS
    # only. The frontend deploys independently via Vercel, so a
    # frontend-only or docs-only commit never needs this pipeline —
    # skip the GHCR rebuild + VPS container recreate for them. A mixed
    # commit that also touches backend/src still deploys (paths-ignore
    # only skips when ALL changed files match).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'frontend/**'

env:
  IMAGE: ghcr.io/leanderantony/helpmateai_rag_qa_system/api
  VPS_APP_DIR: /home/ubuntu/HelpmateAI_RAG_QA_System

jobs:
  test:
    name: Run backend test suite
    # Release gate: the image is only built + shipped to the VPS after
    # the backend test suite passes for this exact commit. Without this,
    # a push to main that breaks the backend would build and deploy even
    # while CI is red, because ci.yml runs as an independent workflow with
    # no relationship to this pipeline. The container health check only
    # catches a container that fails to *start*, not a logic regression
    # that still boots (e.g. a broken abstention path or auth check).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest

  build-and-push:
    name: Build Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p "${{ env.VPS_APP_DIR }}/deploy/vps"

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: deploy/vps/docker-compose.yml,deploy/vps/Caddyfile,deploy/vps/cleanup-docker.sh,deploy/vps/deploy-api.sh,deploy/vps/deploy-api-build.sh
          target: ${{ env.VPS_APP_DIR }}/deploy/vps
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE }}
          GITHUB_ACTOR: ${{ env.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE:latest"
            cd "${{ env.VPS_APP_DIR }}/deploy/vps"
            docker compose up -d --no-build api
            docker logout ghcr.io

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "Waiting for container to be healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' helpmate-api 2>/dev/null)
              echo "Attempt $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy"
                exit 0
              fi
              sleep 5
            done
            echo "Container did not become healthy in time"
            docker logs helpmate-api --tail 30
            exit 1

      - name: Cleanup old Docker images and build cache
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd "${{ env.VPS_APP_DIR }}/deploy/vps"
            chmod +x ./cleanup-docker.sh
            sh ./cleanup-docker.sh
